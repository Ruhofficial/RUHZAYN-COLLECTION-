
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAYO STORE | Online Shopping</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7f7;color:#222}
header{background:#151515;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:27px;font-weight:bold;color:#ffb800}
header span{font-size:14px}
.hero{background:linear-gradient(120deg,#171717,#494949);color:white;padding:65px 7%;text-align:center}
.hero h1{font-size:40px;margin-bottom:15px}
.hero p{margin-bottom:22px}
button{border:0;padding:12px 20px;border-radius:6px;background:#ffb800;font-weight:bold;cursor:pointer}
.search{padding:25px 6%;display:flex;gap:10px}
.search input{flex:1;padding:13px;border:1px solid #ddd;border-radius:6px;min-width:0}
h2{padding:10px 6% 20px}
.products{padding:0 6% 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px #0001;padding-bottom:15px}
.card img{width:100%;height:190px;object-fit:cover}
.card h3,.card p{margin:12px}
.card button{margin-left:12px}
.cart{margin:0 6% 35px;background:white;padding:20px;border-radius:10px}
.cart-item{padding:10px 0;border-bottom:1px solid #eee}
footer{background:#151515;color:white;text-align:center;padding:25px}
</style>
</head>
<body>

<header>
<div class="logo">ZAYO STORE</div>
<span>🛍️ Your Shopping Destination</span>
<span>Cart: <b id="count">0</b></span>
</header>

<section class="hero">
<h1>Welcome to ZAYO STORE</h1>
<p>Discover amazing products at amazing prices.</p>
<button onclick="document.getElementById('shop').scrollIntoView()">Shop Now</button>
</section>

<div class="search">
<input id="search" placeholder="Search products..." oninput="renderProducts()">
</div>

<h2 id="shop">Our Products</h2>
<section class="products" id="products"></section>

<section class="cart">
<h2>Your Shopping Cart 🛒</h2>
<div id="cartItems">Your cart is empty.</div>
<h3 id="total">Total: ₹0</h3>
<button onclick="checkout()">Checkout</button>
</section>

<footer>
<h3>ZAYO STORE</h3>
<p>Thank you for shopping with us!</p>
<p>© 2026 ZAYO STORE</p>
</footer>

<script>
const products=[
{id:1,name:"Classic Sneakers",price:1499,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:2,name:"Stylish Watch",price:1999,image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"},
{id:3,name:"Travel Bag",price:999,image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"},
{id:4,name:"Headphones",price:1299,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"},
{id:5,name:"Sunglasses",price:799,image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"},
{id:6,name:"Smart Shoes",price:1799,image:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"}
];
let cart=[];
function renderProducts(){
const q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=products
.filter(p=>p.name.toLowerCase().includes(q))
.map(p=>`<div class="card">
<img src="${p.image}" alt="${p.name}">
<h3>${p.name}</h3>
<p>₹${p.price.toLocaleString("en-IN")}</p>
<button onclick="addToCart(${p.id})">Add to Cart</button>
</div>`).join("");
}
function addToCart(id){
const item=cart.find(x=>x.id===id);
if(item)item.qty++;
else cart.push({...products.find(x=>x.id===id),qty:1});
renderCart();
}
function renderCart(){
document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
document.getElementById("cartItems").innerHTML=cart.length?
cart.map(x=>`<div class="cart-item">${x.name} × ${x.qty} — ₹${(x.price*x.qty).toLocaleString("en-IN")} <button onclick="removeItem(${x.id})">Remove</button></div>`).join("")
:"Your cart is empty.";
document.getElementById("total").textContent="Total: ₹"+cart.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString("en-IN");
}
function removeItem(id){
cart=cart.filter(x=>x.id!==id);
renderCart();
}
function checkout(){
if(!cart.length){alert("Please add products first!");return;}
alert("Shopping demo ready! Real checkout and payment will be added after backend setup.");
}
renderProducts();
</script>
</body>
</html>
